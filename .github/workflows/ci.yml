name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: EventHorizon
